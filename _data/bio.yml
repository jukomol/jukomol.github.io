bio_full: |
  Hi, I’m Jahir Uddin, a researcher, builder, and lifelong learner. 
  I’m pursuing my PhD in Environmental and Occupational Health at the 
  University of Nebraska Medical Center, where I study how technology 
  and AI can make agricultural work safer and smarter. Beyond research, 
  I love designing things that solve real problems, from computer vision 
  systems to small creative projects. My goal is simple: use science and 
  engineering to make people’s lives better, one idea at a time.
