<body>
  <nav class="vertical-navbar">
    <ul class="nav-links">
      <li><a href="/index.html"><i class="fa fa-home"></i><span class="nav-text"> Home</span></a></li>

  <main class="container mt-5" id="content">
    <h1 class="gallery-title">Gallery</h1>

    <div class="album-nav">
      <button class="album-btn active" data-album="all">All</button>
      <button class="album-btn" data-album="travel">Travel</button>
      <button class="album-btn" data-album="work">Work</button>
      <button class="album-btn" data-album="events">Events</button>
    </div>

    <div class="masonry" id="gallery">
      <div class="masonry-item" data-album="travel">
        <img src="/img/JAHIR.jpg" alt="Travel Photo" onclick="openModal(this)" data-caption="Sunset at the beach">
        <div class="image-caption">Sunset at the beach</div>
      </div>
      <div class="masonry-item" data-album="work">
        <img src="/img/godzila.jpg" alt="Work Photo" onclick="openModal(this)" data-caption="Project Collaboration on AI">
        <div class="image-caption">Project Collaboration</div>
      </div>
      <div class="masonry-item" data-album="events">
        <img src="/img/fedora.png" alt="Event Photo" onclick="openModal(this)" data-caption="Award Ceremony at Tech Fest 2023">
        <div class="image-caption">Award Ceremony</div>
      </div>
      <div class="masonry-item" data-album="events">
        <img src="/img/JAHIR.jpg" alt="Event Photo" onclick="openModal(this)" data-caption="Another Event Capture">
        <div class="image-caption">Another Ceremony</div>
      </div>
            <div class="masonry-item" data-album="events">
        <img src="/img/JAHIR.jpg" alt="Event Photo" onclick="openModal(this)" data-caption="Another Event Capture">
        <div class="image-caption">Another Ceremony</div>
      </div>
            <div class="masonry-item" data-album="events">
        <img src="/img/JAHIR.jpg" alt="Event Photo" onclick="openModal(this)" data-caption="Another Event Capture">
        <div class="image-caption">Another Ceremony</div>
      </div>
            <div class="masonry-item" data-album="events">
        <img src="/img/JAHIR.jpg" alt="Event Photo" onclick="openModal(this)" data-caption="Another Event Capture">
        <div class="image-caption">Another Ceremony</div>
      </div>
    </div>
  </main>

  <!-- Modal Structure -->
<!-- Modal Structure -->
<div id="imageModal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>
  <img class="modal-content" id="modalImg">
  <div id="modalCaption"></div>
</div>



  <script>
    const albumButtons = document.querySelectorAll('.album-btn');
    const galleryItems = document.querySelectorAll('.masonry-item');

    albumButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        albumButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const album = btn.dataset.album;
        galleryItems.forEach(item => {
          if (album === 'all' || item.dataset.album === album) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });

    function openModal(imgElement) {
      const modal = document.getElementById("imageModal");
      const modalImg = document.getElementById("modalImg");
      const captionText = document.getElementById("modalCaption");

      modal.style.display = "block";
      modalImg.src = imgElement.src;
      captionText.innerHTML = imgElement.getAttribute("data-caption");
    }

    function closeModal() {
      document.getElementById("imageModal").style.display = "none";
    }
  </script>
</body>
