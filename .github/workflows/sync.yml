name: Sync Issues (stable)

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
    
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: sync-issues-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Git safe dir + line endings
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config core.autocrlf input

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync_issues.mjs

      - name: Stage generated content
        run: |
          git add _data/ _posts/ _pubs/ _talks/ _resources/ || true
          git status --porcelain || true

      # Minimal preflight: catch obvious breakage before commit
      - name: Quick front-matter & conflict check
        run: |
          set -e
          changed=$(git diff --name-only --staged || true)
          [ -z "$changed" ] && exit 0

          # 1) no merge conflict markers
          if grep -R --line-number -E '^(<<<<<<<|=======|>>>>>>>)' -- $changed; then
            echo "Found merge conflict markers in staged changes"; exit 1
          fi

          # 2) basic front matter sanity on changed markdown
          for f in $changed; do
            case "$f" in
              _posts/*|_pubs/*|_talks/*|_resources/*)
                head -n1 "$f" | grep -q '^---$' || { echo "Missing opening --- in $f"; exit 1; }
                awk '/^---$/ {c++} END{ if(c<2) exit 1 }' "$f" || { echo "Missing closing --- in $f"; exit 1; }
              ;;
            esac
          done

      - name: Upload changed files (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changed-files
          path: |
            $(git diff --name-only --staged || echo "")
          if-no-files-found: ignore

      - name: Commit (skip if nothing changed)
        run: |
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync content from GitHub Issues"

      - name: Rebase onto latest main (fail safely)
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -e
          # Get latest remote
          git fetch origin "${BRANCH_NAME}"

          # If our local HEAD is already ahead of origin, great. If behind, rebase.
          # Abort on any conflicts to avoid polluting content with markers.
          if ! git rebase "origin/${BRANCH_NAME}"; then
            echo "Rebase produced conflicts; aborting to protect site."
            git rebase --abort
            exit 1
          fi

          # Guardrail: ensure no conflict markers slipped in
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- _data/ _posts/ _pubs/ _talks/ _resources/ ; then
            echo "Conflict markers detected after rebase; refusing to push."
            exit 1
          fi

      - name: Push (after clean rebase)
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git push origin "${BRANCH_NAME}"
      - name: Trigger Build & Deploy
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-build

