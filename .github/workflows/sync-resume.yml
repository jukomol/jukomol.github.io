name: Sync resume from Overleaf

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm -y init >/dev/null 2>&1
          npm i -D playwright@1
          npx playwright install --with-deps chromium

      - name: Write downloader script
        env:
          OVERLEAF_VIEW_URL: ${{ secrets.OVERLEAF_VIEW_URL || vars.OVERLEAF_VIEW_URL }}
          OVERLEAF_DL_TEXT:  ${{ secrets.OVERLEAF_DL_TEXT  || vars.OVERLEAF_DL_TEXT  || 'Download PDF' }}
        run: |
          echo "::add-mask::${OVERLEAF_VIEW_URL}"
          echo "::add-mask::${OVERLEAF_DL_TEXT}"
          cat > download-overleaf.mjs <<'EOF'
          import { chromium } from 'playwright';

          const VIEW_URL = process.env.OVERLEAF_VIEW_URL?.trim();
          const DL_TEXT  = (process.env.OVERLEAF_DL_TEXT || 'Download PDF').trim();

          if (!VIEW_URL) {
            console.error('OVERLEAF_VIEW_URL is empty.');
            process.exit(1);
          }

          const browser = await chromium.launch();
          const context = await browser.newContext({ acceptDownloads: true, userAgent: 'Mozilla/5.0' });
          const page = await context.newPage();

          // Go to the read-only view; wait for network to settle
          await page.goto(VIEW_URL, { waitUntil: 'domcontentloaded' });

          // Prefer a control with visible text "Download PDF"; otherwise fall back to any link containing /download/
          let downloadPromise;
          try {
            const btn = page.getByRole('link', { name: DL_TEXT }).first();
            await btn.waitFor({ timeout: 8000 });
            downloadPromise = page.waitForEvent('download', { timeout: 15000 });
            await btn.click();
          } catch {
            const link = page.locator('a[href*="/download"]').first();
            await link.waitFor({ timeout: 8000 });
            downloadPromise = page.waitForEvent('download', { timeout: 15000 });
            await link.click();
          }

          const download = await downloadPromise;
          await download.saveAs('tmp/resume.pdf');

          await browser.close();
          EOF

      - name: Fetch latest PDF via headless browser
        run: |
          mkdir -p tmp
          node download-overleaf.mjs
          file tmp/resume.pdf | grep -qi 'PDF' || (echo "Downloaded file is not a PDF"; exit 1)

      - name: Compare and commit if changed
        run: |
          DEST="files/Jahir_Uddin_resume.pdf"
          mkdir -p "$(dirname "$DEST")"

          oldsum="missing"
          [ -f "$DEST" ] && oldsum=$(sha256sum "$DEST" | cut -d' ' -f1)
          newsum=$(sha256sum tmp/resume.pdf | cut -d' ' -f1)

          if [ "$oldsum" != "$newsum" ]; then
            cp tmp/resume.pdf "$DEST"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "Update Jahir_Uddin_resume.pdf from Overleaf"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "No change."
          fi
