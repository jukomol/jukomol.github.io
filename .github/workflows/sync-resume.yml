name: Sync resume from Overleaf

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Prefer repo SECRETS; fall back to repo VARIABLES.
      VIEW_URL: ${{ secrets.OVERLEAF_VIEW_URL || vars.OVERLEAF_VIEW_URL }}
      DL_TEXT:  ${{ secrets.OVERLEAF_DL_TEXT  || vars.OVERLEAF_DL_TEXT  || 'Download PDF' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm -y init >/dev/null 2>&1
          npm i -D playwright@1
          npx playwright install --with-deps chromium

      - name: Sanity check (length only)
        run: |
          echo "VIEW_URL length: ${#VIEW_URL}"
          echo "DL_TEXT  length: ${#DL_TEXT}"
          if [ -z "$VIEW_URL" ]; then
            echo "VIEW_URL is empty at runtime"; exit 1
          fi

      - name: Write downloader script
        run: |
          echo "::add-mask::${VIEW_URL}" || true
          echo "::add-mask::${DL_TEXT}" || true
          cat > download-overleaf.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, request } from 'playwright';

          const VIEW_URL = process.env.VIEW_URL?.trim();
          const DL_TEXT  = (process.env.DL_TEXT || 'Download PDF').trim();
          const TMP_DIR  = 'tmp';
          const OUT_PDF  = path.join(TMP_DIR, 'resume.pdf');
          const OUT_HTML = path.join(TMP_DIR, 'view.html');
          const OUT_PNG  = path.join(TMP_DIR, 'view.png');

          async function saveDebug(page) {
            try {
              await fs.promises.mkdir(TMP_DIR, { recursive: true });
              await fs.promises.writeFile(OUT_HTML, await page.content());
              await page.screenshot({ path: OUT_PNG, fullPage: true });
            } catch {}
          }

          if (!VIEW_URL) { console.error('VIEW_URL is empty'); process.exit(1); }

          await fs.promises.mkdir(TMP_DIR, { recursive: true });

          const browser = await chromium.launch();
          const context = await browser.newContext({ acceptDownloads: true, userAgent: 'Mozilla/5.0' });
          const page = await context.newPage();

          try {
            await page.goto(VIEW_URL, { waitUntil: 'networkidle', timeout: 30000 });

            // Try to find a visible "Download PDF" control first
            let link;
            try {
              const byRole = page.getByRole('link', { name: DL_TEXT }).first();
              await byRole.waitFor({ timeout: 8000 });
              link = byRole;
            } catch {
              // Fallback: any anchor whose href contains /download
              const byHref = page.locator('a[href*="/download"]').first();
              await byHref.waitFor({ state: 'attached', timeout: 15000 });
              link = byHref;
            }

            // Try Playwright's download event path
            let downloaded = false;
            try {
              const downloadPromise = page.waitForEvent('download', { timeout: 20000 });
              await link.click({ force: true });
              const download = await downloadPromise;
              await download.saveAs(OUT_PDF);
              downloaded = true;
            } catch {
              // Fallback: resolve the href and fetch with same cookies via APIRequestContext
              const href = await link.getAttribute('href');
              if (!href) throw new Error('No href found on download link');
              const downloadUrl = new URL(href, VIEW_URL).toString();

              const storageState = await context.storageState();
              const api = await request.newContext({
                extraHTTPHeaders: { 'Referer': VIEW_URL, 'User-Agent': 'Mozilla/5.0' },
                storageState
              });

              const resp = await api.get(downloadUrl);
              if (!resp.ok()) {
                throw new Error(`Fallback GET failed: ${resp.status()} ${resp.statusText()}`);
              }
              const buf = await resp.body();
              await fs.promises.writeFile(OUT_PDF, buf);
              downloaded = true;
            }

            if (!downloaded) throw new Error('Download did not complete');

          } catch (e) {
            console.error(String(e));
            await saveDebug(page);
            await browser.close();
            process.exit(1);
          }

          await browser.close();
          EOF

      - name: Fetch latest PDF via headless browser
        run: |
          mkdir -p tmp
          node download-overleaf.mjs
          file tmp/resume.pdf | grep -qi 'PDF' || (echo "Downloaded file is not a PDF"; exit 1)

      - name: Compare, replace, and commit if changed
        run: |
          DEST="assets/cv/Jahir_Uddin_CV.pdf"
          mkdir -p "$(dirname "$DEST")"

          oldsum="missing"
          [ -f "$DEST" ] && oldsum=$(sha256sum "$DEST" | cut -d' ' -f1)
          newsum=$(sha256sum tmp/resume.pdf | cut -d' ' -f1)

          echo "Old SHA256: $oldsum"
          echo "New SHA256: $newsum"

          if [ "$oldsum" != "$newsum" ]; then
            echo "Resume changed – replacing old PDF."
            cp tmp/resume.pdf "$DEST"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add "$DEST"
            git commit -m "Update Jahir_Uddin_CV.pdf from Overleaf" || {
              echo "Nothing to commit after all"; exit 0;
            }

            # Push back to the same branch this workflow ran on
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          else
            echo "No change in resume – nothing to commit."
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: overleaf-debug
          path: |
            tmp/view.html
            tmp/view.png

      - name: Trigger Build & Deploy
        if: success() && github.ref == 'refs/heads/master'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: trigger-build
