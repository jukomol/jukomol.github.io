<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- SEO Meta Tags -->
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="author" content="{% if page.author %}{{ page.author }}{% else %}{{ site.data.bio.name }}{% endif %}">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description | escape }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ site.data.site.seo.og_image | absolute_url }}{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="{{ site.data.site.seo.twitter_card }}">
  <meta name="twitter:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description | escape }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="twitter:image" content="{% if page.image %}{{ page.image | absolute_url }}{% else %}{{ site.data.site.seo.og_image | absolute_url }}{% endif %}">
  {% if site.data.site.social.twitter %}<meta name="twitter:site" content="@{{ site.data.site.social.twitter }}">{% endif %}
  
  <!-- Canonical URL -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  
  <!-- Schema.org markup for Google -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    {% if page.layout == 'home' or page.url == '/' %}
    "@type": "Person",
    "name": "{{ site.data.bio.name }}",
    "jobTitle": "{{ site.data.bio.title }}",
    "affiliation": {
      "@type": "Organization",
      "name": "{{ site.data.bio.affiliation }}"
    },
    "url": "{{ site.url }}",
    "email": "{{ site.data.bio.email }}",
    "sameAs": [
      {% if site.data.site.social.github %}"https://github.com/{{ site.data.site.social.github }}"{% endif %}
      {% if site.data.site.social.twitter %},"https://twitter.com/{{ site.data.site.social.twitter }}"{% endif %}
      {% if site.data.site.social.linkedin %},"https://linkedin.com/in/{{ site.data.site.social.linkedin }}"{% endif %}
      {% if site.data.site.social.scholar %},"{{ site.data.site.social.scholar }}"{% endif %}
    ]
    {% elsif page.layout == 'post' %}
    "@type": "BlogPosting",
    "headline": "{{ page.title }}",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    {% if page.modified %}"dateModified": "{{ page.modified | date_to_xmlschema }}",{% endif %}
    "author": {
      "@type": "Person",
      "name": "{% if page.author %}{{ page.author }}{% else %}{{ site.data.bio.name }}{% endif %}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ site.title }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.data.site.seo.og_image | absolute_url }}"
      }
    },
    "description": "{% if page.description %}{{ page.description | escape }}{% elsif page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% endif %}",
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": "{{ page.url | absolute_url }}"
    }
    {% elsif page.layout == 'pub' %}
    "@type": "ScholarlyArticle",
    "headline": "{{ page.title }}",
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "author": {
      "@type": "Person",
      "name": "{% if page.authors %}{{ page.authors | join: ', ' }}{% else %}{{ site.data.bio.name }}{% endif %}"
    },
    "description": "{% if page.abstract %}{{ page.abstract | escape }}{% elsif page.description %}{{ page.description | escape }}{% endif %}",
    {% if page.doi %}"identifier": "https://doi.org/{{ page.doi }}",{% endif %}
    {% if page.venue %}"publication": "{{ page.venue }}",{% endif %}
    "url": "{{ page.url | absolute_url }}"
    {% else %}
    "@type": "WebPage",
    "name": "{{ page.title }}",
    "description": "{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}",
    "url": "{{ page.url | absolute_url }}"
    {% endif %}
  }
  </script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
  
  <!-- RSS Feed -->
  {% feed_meta %}
</head>
